<header class="container mx-auto flex items-center justify-between py-6 px-4">
    <a href="/" class="text-xl font-semibold">
        chemistry.software
    </a>
    <div class="flex items-center gap-4 md:gap-8">
        <nav class="hidden md:flex items-center gap-8">
            <a hx-get="/about" hx-target="#content" hx-swap="innerHTML" class="text-gray-600 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white">{{t .Trans "About"}}</a>
            <a hx-get="/services" hx-target="#content" hx-swap="innerHTML" class="text-gray-600 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white">{{t .Trans "Services"}}</a>
            <a hx-get="/contact" hx-target="#content" hx-swap="innerHTML" class="text-gray-600 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white">{{t .Trans "Contact"}}</a>
        </nav>
        <button
            class="p-2 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700"
            hx-get="/toggle-language"
            hx-target="#header-container"
            hx-swap="innerHTML"
            title="{{if eq .Lang "nl"}}{{t .Trans "Switch to English"}}{{else}}{{t .Trans "Switch to Dutch"}}{{end}}"
        >
            {{if eq .Lang "nl"}}EN{{else}}NL{{end}}
        </button>
        {{if .IsDark}}
        <button
            class="p-2 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700"
            hx-get="/toggle-theme?dark=false"
            hx-swap="outerHTML"
            title="Switch to light mode"
        >
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
            </svg>
        </button>
        {{else}}
        <button
            class="p-2 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700"
            hx-get="/toggle-theme?dark=true"
            hx-swap="outerHTML"
            title="Switch to dark mode"
        >
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707-.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
            </svg>
        </button>
        {{end}}
    </div>
</header>
