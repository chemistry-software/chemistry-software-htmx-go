{{ define "base" }}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} | chemistry.software</title>
    <link rel="stylesheet" href="/static/css/pico.min.css">
    <script src="/static/js/htmx.min.js"></script>
    <style>
        /* Theme toggle improvements */
        .theme-toggle {
            background: none;
            border: none;
            padding: 0.5rem;
            margin: -0.5rem;
            cursor: pointer;
            border-radius: var(--pico-border-radius);
            transition: background-color 0.2s;
            color: var(--pico-color);
        }
        .theme-toggle:hover {
            background: var(--pico-form-element-background-color);
        }
        
        /* Hero section improvements */
        .hero {
            padding: 6rem 0;
            margin-bottom: 2rem;
            background: linear-gradient(135deg, var(--hero-gradient-start), var(--hero-gradient-end));
            color: white;
        }
        
        [data-theme="light"] {
            --hero-gradient-start: #6366f1;
            --hero-gradient-end: #8b5cf6;
        }
        
        [data-theme="dark"] {
            --hero-gradient-start: #4f46e5;
            --hero-gradient-end: #7c3aed;
        }
        
        .hero h1 {
            color: white;
            font-size: 3rem;
            line-height: 1.2;
            margin-bottom: 1.5rem;
        }
        
        .hero p {
            font-size: 1.25rem;
            opacity: 0.9;
            margin-bottom: 2rem;
        }
        
        .hero-image {
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            margin: 0 auto;
        }
        
        .service-card {
            background: var(--pico-card-background-color);
            padding: 2rem;
            border-radius: var(--pico-border-radius);
            margin-bottom: 1rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .service-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--pico-card-box-shadow);
        }

        /* Smooth theme transition */
        html {
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* HTMX loading states */
        .htmx-indicator {
            opacity: 0;
            transition: opacity 200ms ease-in;
        }
        .htmx-request .htmx-indicator {
            opacity: 1
        }
        .htmx-request.htmx-indicator {
            opacity: 1
        }

        [data-theme="light"] .theme-toggle {
            color: var(--pico-contrast);
        }
    </style>
</head>
<body>
    <nav class="container">
        <ul>
            <li><strong><a href="/" class="contrast" hx-get="/" hx-target="#content" hx-push-url="true">chemistry.software</a></strong></li>
        </ul>
        <ul>
            <li><a href="/about" class="contrast" hx-get="/about" hx-target="#content" hx-push-url="true">About</a></li>
            <li><a href="/services" class="contrast" hx-get="/services" hx-target="#content" hx-push-url="true">Services</a></li>
            <li><a href="/contact" class="contrast" hx-get="/contact" hx-target="#content" hx-push-url="true">Contact</a></li>
            <li>
                <button class="theme-toggle contrast" onclick="toggleTheme()" aria-label="Toggle theme">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="5"/>
                        <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                    </svg>
                </button>
            </li>
        </ul>
    </nav>

    <main id="content" hx-target="this" hx-swap="innerHTML">
        {{ block "content" . }}{{ end }}
    </main>

    <footer class="container">
        <small>© 2025 chemistry.software - Where Software Meets Chemistry</small>
    </footer>

    <script>
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        }

        // Set initial theme from localStorage or system preference
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const savedTheme = localStorage.getItem('theme') || (prefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
</body>
</html>
{{ end }}
