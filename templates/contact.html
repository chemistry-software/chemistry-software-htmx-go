<!-- Contact Section -->
<section id="contact" class="container mx-auto py-24 px-4">
    <h2 class="text-4xl font-bold text-center mb-4">
        {{t .Trans "Get in touch"}}
    </h2>
    <p class="text-xl text-center text-gray-600 dark:text-gray-300 mb-8">
        {{t .Trans "Ready to revolutionize your chemical processes?"}}
    </p>

    <div class="max-w-lg mx-auto">
        <form hx-post="/contact" hx-target="#contact-form-response" hx-swap="innerHTML">
            <div class="mb-4">
                <label for="name" class="block text-gray-700 dark:text-gray-200 text-sm font-bold mb-2">{{t .Trans "Name"}}</label>
                <input type="text" id="name" name="name" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 dark:text-gray-200 leading-tight focus:outline-none focus:shadow-outline dark:bg-gray-800 dark:border-gray-700" required>
            </div>
            <div class="mb-4">
                <label for="email" class="block text-gray-700 dark:text-gray-200 text-sm font-bold mb-2">{{t .Trans "Email"}}</label>
                <input type="email" id="email" name="email" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 dark:text-gray-200 leading-tight focus:outline-none focus:shadow-outline dark:bg-gray-800 dark:border-gray-700" required>
            </div>
            <div class="mb-6">
                <label for="message" class="block text-gray-700 dark:text-gray-200 text-sm font-bold mb-2">{{t .Trans "Message"}}</label>
                <textarea id="message" name="message" rows="5" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 dark:text-gray-200 leading-tight focus:outline-none focus:shadow-outline dark:bg-gray-800 dark:border-gray-700" required></textarea>
            </div>
            <div class="flex items-center justify-between">
                <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline" type="submit">
                    {{t .Trans "Send"}}
                </button>
            </div>
            <div id="contact-form-response" class="mt-4 text-center">
                <!-- Response messages will be displayed here -->
            </div>
        </form>
    </div>
</section>
