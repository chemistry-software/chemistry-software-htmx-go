<section class="container mx-auto py-24 px-4 flex justify-around items-center">
    <div class="relative group">
        <a hx-get="/about" hx-target="#content" hx-swap="innerHTML" class="block">
            <svg width="150" height="150" viewBox="0 0 100 100" class="animate-spin transition-transform transform group-hover:scale-110">
                <title>{{t .Trans "About us"}}</title>
                <!-- Nucleus (Gold color) -->
                <circle cx="50" cy="50" r="20" fill="#FFD700" />
                <!-- Electron shells -->
                <circle cx="50" cy="50" r="40" fill="none" stroke="#FFD700" stroke-width="3" stroke-dasharray="5,5" />
                <circle cx="50" cy="50" r="60" fill="none" stroke="#FFD700" stroke-width="3" stroke-dasharray="5,5" />
                <!-- Electrons (simplified) -->
                <circle cx="85" cy="50" r="4" fill="#FFD700" />
                <circle cx="15" cy="50" r="4" fill="#FFD700" />
                <circle cx="50" cy="85" r="4" fill="#FFD700" />
                <circle cx="50" cy="15" r="4" fill="#FFD700" />
                {/* Element symbol */}
                <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-size="12px" fill="black">Au</text>
            </svg>
        </a>
        <div class="absolute bottom-0 left-1/2 -translate-x-1/2 hidden group-hover:block text-center mt-2 text-lg">
            {{t .Trans "About us"}}
        </div>
    </div>

    <div class="relative group">
        <a hx-get="/services" hx-target="#content" hx-swap="innerHTML" class="block">
            <svg width="150" height="150" viewBox="0 0 100 100" class="animate-spin transition-transform transform group-hover:scale-110">
                <title>{{t .Trans "Services"}}</title>
                <!-- Nucleus (Selenium color) -->
                <circle cx="50" cy="50" r="20" fill="#FF7F00" />
                <!-- Electron shells -->
                <circle cx="50" cy="50" r="40" fill="none" stroke="#FF7F00" stroke-width="3" stroke-dasharray="5,5" />
                <circle cx="50" cy="50" r="60" fill="none" stroke="#FF7F00" stroke-width="3" stroke-dasharray="5,5" />
                <!-- Electrons -->
                <circle cx="85" cy="50" r="4" fill="#FF7F00" />
                <circle cx="15" cy="50" r="4" fill="#FF7F00" />
                <circle cx="50" cy="85" r="4" fill="#FF7F00" />
                {/* Element symbol */}
                <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-size="12px" fill="black">Se</text>
            </svg>
        </a>
        <div class="absolute bottom-0 left-1/2 -translate-x-1/2 hidden group-hover:block text-center mt-2 text-lg">
            {{t .Trans "Services"}}
        </div>
    </div>

    <div class="relative group">
        <a hx-get="/contact" hx-target="#content" hx-swap="innerHTML" class="block">
            <svg width="150" height="150" viewBox="0 0 100 100" class="animate-spin transition-transform transform group-hover:scale-110">
                <title>{{t .Trans "Contact"}}</title>
                <!-- Nucleus (Cobalt color) -->
                <circle cx="50" cy="50" r="20" fill="#008080" />
                <!-- Electron shells -->
                <circle cx="50" cy="50" r="40" fill="none" stroke="#008080" stroke-width="3" stroke-dasharray="5,5" />
                <circle cx="50" cy="50" r="60" fill="none" stroke="#008080" stroke-width="3" stroke-dasharray="5,5" />
                <!-- Electrons -->
                <circle cx="85" cy="50" r="4" fill="#008080" />
                <circle cx="15" cy="50" r="4" fill="#008080" />
                <circle cx="50" cy="85" r="4" fill="#008080" />
                {/* Element symbol */}
                <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-size="12px" fill="white">Co</text>
            </svg>
        </a>
        <div class="absolute bottom-0 left-1/2 -translate-x-1/2 hidden group-hover:block text-center mt-2 text-lg">
            {{t .Trans "Contact"}}
        </div>
    </div>
</section>
